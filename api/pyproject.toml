[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import sorting
    "B",        # bugbear
    "S",        # bandit - security lint, deliberately enabled
    "N",        # naming
    "UP",       # pyupgrade
    "SIM",      # simplify
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
"migrations/*" = ["E501", "I001"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]
exclude = "migrations/"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "auth: authentication and authorisation behaviour",
    "rbac: role-based access control enforcement",
]

# These packages ship no type stubs. Ignoring their imports keeps mypy strict
# about our own code instead of drowning it in library noise.
[[tool.mypy.overrides]]
module = ["flask_cors.*", "flask_limiter.*", "flask_migrate.*", "cloudinary.*", "slugify.*"]
ignore_missing_imports = true
